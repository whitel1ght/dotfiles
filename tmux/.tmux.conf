# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save/restore for resurrect
set -g @plugin 'whitel1ght/tmux-claude-picker'  # ` j / ` a — jump to a Claude Code window
set -g @plugin 'pteroctopus/fuzzmux.tmux'       # ` s/w/p/f — fuzzy find session/window/pane/nvim buffer

# fuzzmux: fuzzy navigation over sessions, windows, panes and nvim buffers.
# Takes over the tmux defaults for `s` and `w` (choose-tree) and `f`
# (find-window) — all three are strict upgrades. `p` is remapped to C-p below
# so prefix-p keeps its default previous-window meaning.
set -g @fuzzmux-bind-pane 'C-p'
set -g @fuzzmux-bind-pane-zoom 'M-p'
# Preview below the list rather than beside it: these rows are long
# ("session:index name path:command"), so a 30% right split squeezes them.
set -g @fuzzmux-session-preview-window 'down:60%'
set -g @fuzzmux-window-preview-window 'down:60%'
set -g @fuzzmux-pane-preview-window 'down:60%'

# tmux-claude-picker: ` j / ` a jump to a Claude window, ` o opens a file path
# found in the current pane. ` o displaces tmux's select-pane, which fuzzmux's
# C-p picker already supersedes; M-o is not an option because AeroSpace claims
# every alt-<letter> for `workspace <letter>` before tmux sees it.
set -g @claude-picker-open-path-key 'o'

# tmux-continuum: automatic session save/restore (works with tmux-resurrect).
# Must be configured before the `run '.../tpm'` line at the bottom of this file.
set -g @continuum-restore 'on'      # restore last saved environment on tmux start
set -g @continuum-save-interval '15'  # auto-save every 15 minutes

# rebind tmux prefix
unbind C-b
set -g prefix `
bind-key ` send-prefix

# needed for neovim autoread
set -g focus-events on

# enable mouse support
set -g mouse on

# indexing windows properly
setw -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1

# Automatic window names as "<dir>:<command>" (e.g. "dotfiles:nvim") so window
# lists carry both the project and what is running — the two things you'd
# actually type when fuzzy-searching for a window. Plain "nvim" or "zsh" is
# useless once several projects are open.
#
# Note: tmux disables automatic-rename for any window you rename by hand (or
# that a shell escape sequence renames). `rename-window ""` restores it.
#
# Claude Code reports its version as the process name ("2.1.220"), which would
# name windows "dotfiles:2.1.220" — version noise in place of the one label you
# actually search for. Substitute "claude" for anything that looks like a bare
# version number and keep the command name otherwise.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}:#{s|^[0-9]+\.[0-9]+\.[0-9]+$|claude|:pane_current_command}'

# Renumber remaining windows to close the gap when one is closed
set -g renumber-windows on

# transparent bg for statusline
set -g status-style bg=terminal
set -g status-position top
set -g status-justify centre
# set -g status-left "#S | #I"
set -g status-right ""

# Highlight the active window in the status line. tmux's default for both
# window-status-style and window-status-current-style is `default`, which makes
# the current window indistinguishable apart from the trailing `*` flag.
set -g window-status-style 'fg=colour245'
set -g window-status-current-style 'fg=white,bold'
set -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '

# repy (the terminal ebook reader) paints its title bar on the pane's first row,
# so the book title sits flush against the window list above it. repy has no
# top-padding setting of its own — its layout constraints are hardcoded — so the
# breathing room has to come from tmux, as a second, empty status row.
#
# `status` is a session option: it cannot be set per window, so the row is
# switched on and off as you move around instead. session-window-changed covers
# switching windows; window-renamed covers repy starting and quitting in the
# window you are already looking at, since automatic-rename above rewrites the
# name on every command change and so fires exactly then.
#
# The `#{?window_active,...}` guard matters for window-renamed: a rename in a
# background window must not clobber the setting for the window on screen, so
# the else branch just re-sets the current value.
#
# Caveat: a window you renamed by hand has automatic-rename disabled, so there
# the row appears only after switching away and back.
set -g status-format[1] ""
set-hook -g session-window-changed 'set -F status "#{?window_active,#{?#{==:#{pane_current_command},repy},2,on},#{status}}"'
set-hook -g window-renamed         'set -F status "#{?window_active,#{?#{==:#{pane_current_command},repy},2,on},#{status}}"'
set-hook -g client-session-changed 'set -F status "#{?window_active,#{?#{==:#{pane_current_command},repy},2,on},#{status}}"'


# Open new windows and splits in the current pane's directory rather than the
# directory the tmux server was started in (which is ~ here, so `c` otherwise
# lands in home no matter which project the session is for).
bind-key c new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'

# Session navigation
bind-key ( switch-client -p    # previous session
bind-key ) switch-client -n    # next session

# Claude Code pickers: prefix j (busy windows) / prefix a (all windows) /
# prefix o (file path from the pane) — all provided by the
# whitel1ght/tmux-claude-picker plugin declared above.

# Jump straight to a window with Alt+number, no prefix. base-index is 1, so
# the digit matches the index shown in the status bar; M-0 takes the tenth
# window, which is why it is last rather than first.
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
