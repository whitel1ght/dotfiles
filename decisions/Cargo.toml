[package]
name = "decisions"
version = "0.1.0"
edition = "2024"
publish = false
description = "The /run-day decision queue as a deck of cards (tmux prefix y)"

[dependencies]
crossterm = "0.29"
notify-debouncer-mini = "0.7"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tachyonfx = "0.25"
time = { version = "0.3", features = ["parsing"] }
unicode-width = "0.2"
